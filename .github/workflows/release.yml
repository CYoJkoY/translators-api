name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/cyojkoy/translators-api

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Compile source
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest

      - name: Validate tag format
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            exit 0
          fi
          echo "Unsupported release tag: $TAG_NAME"
          echo "Expected vX.Y.Z or vX.Y.Z.devN"
          exit 1

      - name: Validate package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(python -c 'from importlib.metadata import version; print(version("translators-api"))')"
          TAG_VERSION="${TAG_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Package version: $PACKAGE_VERSION"
            echo "Tag version:     $TAG_VERSION"
            echo "Tag and package versions must match exactly."
            exit 1
          fi

      - name: Build Python distributions
        run: |
          python -m pip install "build>=1,<2"
          python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  windows-executable:
    name: Build Windows portable bundle
    needs: validate
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Nuitka build state
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-windows-py3.12-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            nuitka-windows-py3.12-

      - name: Install executable build dependencies
        run: python -m pip install ".[build]"

      - name: Derive artifact name
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart("v")
          "WINDOWS_BUNDLE=translators-api-v$version-windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build standalone bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --enable-plugin=anti-bloat `
            --jobs=4 `
            --lto=no `
            --output-dir=build/windows `
            --output-filename=translators-api.exe `
            --include-package-data=translators `
            --include-package-data=exejs `
            --nofollow-import-to=torch,transformers,tensorflow,IPython,selenium,PyQt5,PyQt6,PyQtWebEngine,PySide2,PySide6,playwright,tkinter,pywebview `
            src/translators_api/cli.py

      - name: Smoke-test standalone bundle
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter "translators-api.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Nuitka did not produce the expected standalone executable."
          }

          $versionOutput = (& $exe.FullName --version 2>&1 | Out-String).Trim()
          $versionLine = ($versionOutput -split "`r?`n") |
            Where-Object { $_ -match 'translators-api' } |
            Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '^translators-api [0-9]+\.[0-9]+\.[0-9]+(?:\.dev[0-9]+)?$') {
            throw "Unexpected version output: $versionOutput"
          }

          $stdout = Join-Path $PWD "build/windows/health.stdout.log"
          $stderr = Join-Path $PWD "build/windows/health.stderr.log"
          $process = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList @("--host", "127.0.0.1", "--port", "18080") `
            -WorkingDirectory $exe.DirectoryName `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1

              if ($process.HasExited) {
                $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
                $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
                throw "Executable exited before becoming healthy (exit code $($process.ExitCode)).`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
              }

              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
                if ($response.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # The service may still be starting.
              }
            }

            if (-not $ready) {
              $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
              $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
              throw "Executable did not become healthy within the timeout.`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Package standalone bundle
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Path build/windows -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) {
            throw "Nuitka standalone distribution directory was not found."
          }
          Compress-Archive -Path (Join-Path $dist.FullName "*") -DestinationPath "build/windows/$env:WINDOWS_BUNDLE.zip" -CompressionLevel Optimal

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows/$env:WINDOWS_BUNDLE.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $bundle).Hash.ToLowerInvariant()
          "$hash  $env:WINDOWS_BUNDLE.zip" | Out-File -FilePath "build/windows/SHA256SUMS-windows-x64.txt" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: |
            build/windows/${{ env.WINDOWS_BUNDLE }}.zip
            build/windows/SHA256SUMS-windows-x64.txt
          if-no-files-found: error

  docker:
    name: Build and publish Docker image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Derive image tags
        id: tags
        env:
          TAG_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_tag=$IMAGE_NAME:$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" =~ \.dev[0-9]+$ ]]; then
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push version tag
        run: |
          docker build -t "${{ steps.tags.outputs.version_tag }}" .
          docker push "${{ steps.tags.outputs.version_tag }}"

      - name: Push stable latest tag
        if: ${{ steps.tags.outputs.latest_tag != '' }}
        run: |
          docker tag "${{ steps.tags.outputs.version_tag }}" "${{ steps.tags.outputs.latest_tag }}"
          docker push "${{ steps.tags.outputs.latest_tag }}"

  release:
    name: Create GitHub Release
    needs: [validate, docker, windows-executable]
    runs-on: ubuntu-latest
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/python

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: dist/windows

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=()
          if [[ "$TAG_NAME" =~ \.dev[0-9]+$ ]]; then
            PRERELEASE_FLAG+=(--prerelease)
          fi
          gh release create "$TAG_NAME" \
            dist/python/* \
            dist/windows/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${PRERELEASE_FLAG[@]}"
