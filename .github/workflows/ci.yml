name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest

  windows-executable:
    name: Build and smoke-test Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build onefile executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          python -m nuitka `
            --mode=onefile `
            --assume-yes-for-downloads `
            --output-dir=build/windows `
            --output-filename=translators-api-ci.exe `
            --include-package=translators `
            --include-package-data=translators `
            --include-package=exejs `
            --include-package-data=exejs `
            src/translators_api/cli.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/windows/translators-api-ci.exe"
          if (-not (Test-Path $exe)) {
            throw "Nuitka did not produce the expected executable."
          }

          $version = & $exe --version
          if ($version -notmatch '^translators-api 0\.1\.0$') {
            throw "Unexpected version output: $version"
          }

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @("--host", "127.0.0.1", "--port", "18080") `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 3
                if ($response.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # The service may still be starting.
              }
            }

            if (-not $ready) {
              throw "Executable did not become healthy within the timeout."
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t translators-api:ci .
