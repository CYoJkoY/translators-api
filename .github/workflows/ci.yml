name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest

  windows-executable:
    name: Build and smoke-test Windows standalone bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Nuitka build state
        uses: actions/cache@v4
        with:
          path: .nuitka-cache
          key: nuitka-windows-py3.12-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            nuitka-windows-py3.12-

      - name: Install build dependencies
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: python -m pip install ".[build]"

      - name: Build standalone bundle
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --enable-plugin=anti-bloat `
            --jobs=4 `
            --lto=no `
            --output-dir=build/windows `
            --output-filename=translators-api-ci.exe `
            --include-package-data=translators `
            --include-package-data=exejs `
            --nofollow-import-to=torch,transformers,tensorflow,IPython,selenium,PyQt5,PyQt6,PyQtWebEngine,PySide2,PySide6,playwright,tkinter,pywebview `
            src/translators_api/cli.py

      - name: Smoke-test standalone bundle
        shell: pwsh
        env:
          NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter "translators-api-ci.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Nuitka did not produce the expected standalone executable."
          }

          $versionOutput = (& $exe.FullName --version 2>&1 | Out-String).Trim()
          $versionLine = ($versionOutput -split "`r?`n") |
            Where-Object { $_ -match 'translators-api' } |
            Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '^translators-api 0\.1\.0$') {
            throw "Unexpected version output: $versionOutput"
          }

          $stdout = Join-Path $PWD "build/windows/health.stdout.log"
          $stderr = Join-Path $PWD "build/windows/health.stderr.log"
          $process = Start-Process `
            -FilePath $exe.FullName `
            -ArgumentList @("--host", "127.0.0.1", "--port", "18080") `
            -WorkingDirectory $exe.DirectoryName `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1

              if ($process.HasExited) {
                $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
                $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
                throw "Executable exited before becoming healthy (exit code $($process.ExitCode)).`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
              }

              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 2
                if ($response.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # The service may still be starting.
              }
            }

            if (-not $ready) {
              $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
              $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
              throw "Executable did not become healthy within the timeout.`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

      - name: Package standalone bundle
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Path build/windows -Directory -Filter "*.dist" | Select-Object -First 1
          if (-not $dist) {
            throw "Nuitka standalone distribution directory was not found."
          }
          Compress-Archive -Path (Join-Path $dist.FullName "*") -DestinationPath "build/windows/translators-api-ci-windows-x64.zip" -CompressionLevel Optimal

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t translators-api:ci .
