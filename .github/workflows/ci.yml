name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest

  windows-executable:
    name: Build and smoke-test Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install ".[build]"

      - name: Build onefile executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          python -m nuitka `
            --mode=onefile `
            --assume-yes-for-downloads `
            --enable-plugin=anti-bloat `
            --output-dir=build/windows `
            --output-filename=translators-api-ci.exe `
            --include-package=translators_api `
            --include-package=translators `
            --include-package-data=translators `
            --include-package=exejs `
            --include-package-data=exejs `
            --include-package=urllib3 `
            --include-package=certifi `
            --include-package=curl_cffi `
            --include-package-data=curl_cffi `
            src/translators_api/cli.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/windows/translators-api-ci.exe"
          $stdout = Join-Path $PWD "build/windows/health.stdout.log"
          $stderr = Join-Path $PWD "build/windows/health.stderr.log"

          if (-not (Test-Path $exe)) {
            throw "Nuitka did not produce the expected executable."
          }

          $versionOutput = (& $exe --version 2>&1 | Out-String).Trim()
          $versionLine = ($versionOutput -split "`r?`n") |
            Where-Object { $_ -match 'translators-api' } |
            Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '^translators-api 0\.1\.0$') {
            throw "Unexpected version output: $versionOutput"
          }

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList @("--host", "127.0.0.1", "--port", "18080") `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2

              if ($process.HasExited) {
                $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
                $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
                throw "Executable exited before becoming healthy (exit code $($process.ExitCode)).`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
              }

              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18080/health" -TimeoutSec 3
                if ($response.status -eq "ok") {
                  $ready = $true
                  break
                }
              } catch {
                # The service may still be starting.
              }
            }

            if (-not $ready) {
              $stdoutText = if (Test-Path $stdout) { Get-Content -Raw $stdout } else { "" }
              $stderrText = if (Test-Path $stderr) { Get-Content -Raw $stderr } else { "" }
              throw "Executable did not become healthy within the timeout.`nSTDOUT:`n$stdoutText`nSTDERR:`n$stderrText"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

  docker:
    runs-on: ubuntu-latest
    needs: [test, windows-executable]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t translators-api:ci .
