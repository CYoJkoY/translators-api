<text x="104" y="176" font-family="Inter,Segoe UI,sans-serif" font-size="56" font-weight="760" fill="#33403D">One contract. Many translators.</text>
<text x="104" y="218" font-family="Inter,Segoe UI,sans-serif" font-size="24" fill="#687773">A small FastAPI boundary around Python Translators.</text>
